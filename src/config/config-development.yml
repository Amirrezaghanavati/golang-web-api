server:
  Port: 5005
  runMode: debug

password:
  minLength: 15
  maxLength: 128
  generateLength: 20
  # Set a positive minimum to require a character class.
  minUppercase: 0
  minLowercase: 0
  minDigits: 0
  minSymbols: 0

logger:
  filePath: ../logs/logs.log
  Encoding: json
  level: debug

cors:
  allowOrigins: "*"

postgres:
  host: 127.0.0.1
  port: 5433
  user: admin
  password: password
  dbName: car_sale_db
  sslMode: false

redis:
  host: localhost
  port: 6379
  password: password
  db: 0
  dealTimeout: 5
  readTimeout: 5
  writeTimeout: 5
  poolSize : 10
  poolTimeout : 15
