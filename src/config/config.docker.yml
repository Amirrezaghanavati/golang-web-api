server:
  Port: 5005
  RunMode: debug

logger:
  filePath: ../logs/logs.log
  Encoding: json
  level: debug

cors:
  allowOrigins: "*"

postgres:
  host: postgres_container
  port: 5432
  user: admin
  password: password
  dbName: car_sale_db
  sslMode: disable
  MaxIdleConns: 15
  MaxOpenConns: 100
  ConnMaxLifetime: 5

redis:
  host: redis_container
  port: 6379
  password: password
  db: 0
  dealTimeout: 5
  readTimeout: 5
  writeTimeout: 5
  poolSize : 10
  poolTimeout : 15
